server:
  port: 8081

spring:
  application:
    name: book-service

  datasource:
    url: jdbc:postgresql://localhost:5433/book_db
    username: book_user
    password: book_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
